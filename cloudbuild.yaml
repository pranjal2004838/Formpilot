steps:
  # Step 1: Build the container image using the Dockerfile we added
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/formpilot:$COMMIT_SHA', '.']

  # Step 2: Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/formpilot:$COMMIT_SHA']

  # Step 3: Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'formpilot'
      - '--image=gcr.io/$PROJECT_ID/formpilot:$COMMIT_SHA'
      - '--region=us-central1' # Change to your preferred GCP region
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/formpilot:$COMMIT_SHA'
